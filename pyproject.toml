[project]
name = "polymarket-mcp"
version = "0.1.0"
description = "Polymarket MCP Server - Opinionated tools for large-scale agentic integrations with the PolyMarket API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
polymarket-mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

